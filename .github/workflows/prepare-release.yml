name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version (for example, 1.2.4)
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'

      - name: Update version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import os
          import re
          from pathlib import Path
          from packaging.version import Version

          path = Path("src/blazingmq/_about.py")
          contents = path.read_text()
          current = re.search(r'^__version__ = "([^"]+)"$', contents, re.MULTILINE).group(1)
          version = os.environ["VERSION"]
          if str(Version(version)) != version or Version(version) <= Version(current):
              raise SystemExit(f"Use a canonical Python version greater than {current}")
          path.write_text(contents.replace(
              f'__version__ = "{current}"', f'__version__ = "{version}"'
          ))
          PY

      - name: Build release notes
        env:
          VERSION: ${{ inputs.version }}
        run: uvx towncrier build --name blazingmq --version "$VERSION" --yes

      - name: Create release PR
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          base: main
          branch: automation/prepare-release-v${{ inputs.version }}
          add-paths: |
            src/blazingmq/_about.py
            CHANGELOG.md
            news/
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          signoff: true
          commit-message: 'Chore: Prepare release v${{ inputs.version }}'
          title: 'Chore: Prepare release v${{ inputs.version }}'
          body: |
            This patch prepares release v${{ inputs.version }} by updating the
            package version and generating the changelog with Towncrier.
          labels: skip news
